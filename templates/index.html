<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GC Creator + Adder Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #08080e;
            color: #e8edf5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image: radial-gradient(circle at 10% 20%, rgba(108, 142, 255, 0.04) 0%, transparent 50%);
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f111a; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #2a2d3f; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #4a4f6f; }

        .container {
            max-width: 1200px;
            width: 100%;
            background: rgba(18, 20, 30, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 28px;
            padding: 30px 35px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 15px;
        }
        .header h1 {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 22px;
            background: linear-gradient(135deg, #b0c7ff, #6b8cff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 1.5px;
        }
        .badge {
            font-size: 11px;
            font-weight: 600;
            padding: 4px 14px;
            border-radius: 40px;
            background: rgba(107, 140, 255, 0.15);
            border: 1px solid rgba(107, 140, 255, 0.2);
            color: #8aa8ff;
        }

        .mode-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .mode-btn {
            padding: 10px 20px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.1);
            background: transparent;
            color: #aaa;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
        }
        .mode-btn.active {
            background: rgba(107,140,255,0.15);
            border-color: rgba(107,140,255,0.3);
            color: #fff;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1.8fr;
            gap: 28px;
        }

        .form-card {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 18px;
            padding: 22px;
        }
        .form-group {
            margin-bottom: 14px;
        }
        .form-group label {
            display: block;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: #6a7a8e;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 10px 14px;
            background: #0c0e16;
            border: 1px solid #1e212b;
            border-radius: 12px;
            color: #e8edf5;
            font-size: 13px;
            font-family: 'Inter', sans-serif;
            transition: border 0.25s, box-shadow 0.25s;
            outline: none;
        }
        .form-group input:focus, .form-group textarea:focus {
            border-color: #6b8cff;
            box-shadow: 0 0 0 3px rgba(107, 140, 255, 0.15);
        }
        .row-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .btn-primary {
            width: 100%;
            padding: 13px 20px;
            background: linear-gradient(135deg, #6b8cff, #8a6cff);
            border: none;
            border-radius: 40px;
            font-weight: 700;
            font-size: 15px;
            color: #fff;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-family: 'Inter', sans-serif;
            margin-top: 6px;
            letter-spacing: 0.5px;
        }
        .btn-primary:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 30px rgba(107, 140, 255, 0.3);
        }
        .btn-secondary {
            background: rgba(107,140,255,0.1);
            border: 1px solid rgba(107,140,255,0.25);
            color: #8aa8ff;
            padding: 10px 16px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
        }
        .btn-secondary:hover {
            background: rgba(107,140,255,0.2);
        }
        .group-list {
            max-height: 200px;
            overflow-y: auto;
            background: rgba(0,0,0,0.2);
            border-radius: 12px;
            padding: 8px;
            margin-top: 8px;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .group-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 0;
            font-size: 12px;
            color: #aaa;
        }
        .group-item input[type="checkbox"] {
            width: 15px;
            height: 15px;
            accent-color: #6b8cff;
        }

        .logs-panel {
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 18px;
            padding: 18px 20px;
            display: flex;
            flex-direction: column;
            min-height: 500px;
        }
        .logs-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        .logs-header span {
            font-size: 12px;
            font-weight: 600;
            color: #6a7a8e;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .logs-actions button {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #6a7a8e;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 10px;
            cursor: pointer;
            transition: 0.2s;
        }
        .logs-actions button:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }

        .stats-bar {
            display: flex;
            gap: 16px;
            background: rgba(0, 0, 0, 0.2);
            padding: 8px 12px;
            border-radius: 40px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            flex-wrap: wrap;
        }
        .stat-item {
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 4px;
            color: #6a7a8e;
        }
        .stat-item .num {
            font-weight: 700;
            font-size: 14px;
            color: #e8edf5;
        }
        .num.green { color: #4ade80; }
        .num.red { color: #ff6b61; }
        .num.cyan { color: #67e8f9; }

        .progress-wrap {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            margin-bottom: 12px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #6b8cff, #8a6cff);
            border-radius: 10px;
            transition: width 0.4s ease;
        }

        .log-container {
            flex: 1;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 12px;
            padding: 8px 12px;
            max-height: 400px;
            overflow-y: auto;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 12px;
            line-height: 1.8;
            border: 1px solid rgba(255, 255, 255, 0.02);
        }
        .log-line {
            padding: 2px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
            display: flex;
            align-items: baseline;
            gap: 8px;
        }
        .log-time {
            color: #4a5a6a;
            font-size: 10px;
            min-width: 60px;
            flex-shrink: 0;
            opacity: 0.6;
        }
        .log-msg {
            flex: 1;
            word-break: break-word;
        }
        .log-type-info .log-msg { color: #67e8f9; }
        .log-type-success .log-msg { color: #4ade80; }
        .log-type-error .log-msg { color: #ff6b61; }
        .log-type-warn .log-msg { color: #fbbf24; }
        .empty-logs {
            color: #2a3340;
            text-align: center;
            padding: 40px 0;
            font-size: 13px;
        }
        .hidden { display: none; }

        @media (max-width: 820px) {
            .grid-2 { grid-template-columns: 1fr; gap: 20px; }
            .container { padding: 18px; }
            .row-2 { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>⚡ GC CREATOR + ADDER</h1>
        <span class="badge">v2 · SSE</span>
    </div>

    <div class="mode-selector">
        <button class="mode-btn active" id="modeCreateBtn" onclick="setMode('create')">🆕 Create GCs</button>
        <button class="mode-btn" id="modeAddBtn" onclick="setMode('add')">➕ Add Users to GCs</button>
    </div>

    <div class="grid-2">
        <!-- LEFT: FORM -->
        <div class="form-card">
            <form id="mainForm">
                <input type="hidden" name="mode" id="modeInput" value="create">

                <div class="form-group">
                    <label>Session ID</label>
                    <input type="text" name="session_id" placeholder="Instagram sessionid" required>
                </div>

                <!-- Create Mode Fields -->
                <div id="createFields">
                    <div class="form-group">
                        <label>Group Count</label>
                        <input type="number" name="group_count" value="10" min="1">
                    </div>
                    <div class="form-group">
                        <label>Usernames (comma separated)</label>
                        <input type="text" name="usernames" placeholder="user1, user2, user3">
                    </div>
                    <div class="form-group">
                        <label>Username to Remove</label>
                        <input type="text" name="remove_username" placeholder="dummy">
                    </div>
                    <div class="form-group">
                        <label>Message (optional)</label>
                        <textarea name="message" rows="2">𝐒ᴏ𝐍ᴀ 𝐔ʀ𝐅 𝐅ʀᴏᴏ𝐓ɪ 𝐂ʜ𝐔ᴅ𝐀𝐘𝐈 𝐀ʙʜɪ𝐘ᴀɴ 𝐒ʜ𝐔ʀ𝐔 𝐁ʏ 𝐀ʏᴀɴ</textarea>
                    </div>
                </div>

                <!-- Add Mode Fields -->
                <div id="addFields" class="hidden">
                    <div class="form-group">
                        <label>Main Users (comma separated)</label>
                        <input type="text" name="main_users" placeholder="user1, user2">
                    </div>
                    <div class="form-group">
                        <label>Dummy Users (comma separated, optional)</label>
                        <input type="text" name="dummy_users" placeholder="dummy1, dummy2">
                    </div>
                    <div class="form-group">
                        <button type="button" class="btn-secondary" onclick="fetchGroups()">⚡ Fetch Groups</button>
                        <div id="fetch-status" style="margin-top:5px; font-size:12px;"></div>
                        <div class="group-list" id="group-list"></div>
                    </div>
                    <input type="hidden" name="group_ids" id="group_ids">
                </div>

                <!-- Common Fields -->
                <div class="row-2">
                    <div class="form-group">
                        <label>Delay (seconds)</label>
                        <input type="number" name="delay" value="5" min="2" step="0.5">
                    </div>
                    <div class="form-group">
                        <label>Add User Delay (seconds)</label>
                        <input type="number" name="add_user_delay" value="10" min="0">
                    </div>
                </div>
                <div class="row-2">
                    <div class="form-group">
                        <label>Batch Size</label>
                        <input type="number" name="batch_size" value="10" min="1">
                    </div>
                    <div class="form-group">
                        <label>Batch Cooldown (seconds)</label>
                        <input type="number" name="batch_cooldown" value="300" min="0">
                    </div>
                </div>

                <button type="submit" class="btn-primary" id="startBtn">🚀 Start</button>
            </form>
        </div>

        <!-- RIGHT: LOGS -->
        <div class="logs-panel">
            <div class="logs-header">
                <span>📡 Live Console</span>
                <div class="logs-actions">
                    <button onclick="clearLogs()">🗑 Clear</button>
                </div>
            </div>
            <div class="stats-bar">
                <div class="stat-item">🎯 Total: <span class="num" id="statTotal">0</span></div>
                <div class="stat-item">✅ Success: <span class="num green" id="statSuccess">0</span></div>
                <div class="stat-item">❌ Failed: <span class="num red" id="statFailed">0</span></div>
                <div class="stat-item">⏳ Progress: <span class="num cyan" id="statProgress">0%</span></div>
            </div>
            <div class="progress-wrap">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="log-container" id="logContainer">
                <div class="empty-logs" id="emptyLogs">⏳ Waiting for action...</div>
            </div>
        </div>
    </div>
</div>

<script>
    let groups = [];
    let selectedGroupIds = new Set();
    let totalGCs = 0, successCount = 0, failCount = 0;

    function setMode(mode) {
        document.getElementById('modeInput').value = mode;
        document.getElementById('modeCreateBtn').classList.toggle('active', mode === 'create');
        document.getElementById('modeAddBtn').classList.toggle('active', mode === 'add');
        document.getElementById('createFields').classList.toggle('hidden', mode !== 'create');
        document.getElementById('addFields').classList.toggle('hidden', mode !== 'add');
        const btn = document.getElementById('startBtn');
        btn.textContent = mode === 'create' ? '🚀 Start Creating GCs' : '🚀 Start Adding Users';
    }

    async function fetchGroups() {
        const sid = document.querySelector('input[name="session_id"]').value.trim();
        if (!sid) { alert('Enter Session ID first'); return; }
        const statusEl = document.getElementById('fetch-status');
        statusEl.textContent = '⏳ Fetching...';
        statusEl.style.color = '#ffb340';

        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 30000);

        try {
            const res = await fetch('/api/fetch-groups', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({session_id: sid}),
                signal: controller.signal
            });
            clearTimeout(timeoutId);
            const data = await res.json();
            if (data.success) {
                groups = data.groups;
                selectedGroupIds = new Set(groups.map(g => g.id));
                renderGroupList();
                statusEl.textContent = `✅ ${groups.length} groups found`;
                statusEl.style.color = '#4ade80';
            } else {
                statusEl.textContent = '❌ ' + (data.error || 'Failed');
                statusEl.style.color = '#ff6b61';
            }
        } catch(e) {
            clearTimeout(timeoutId);
            if (e.name === 'AbortError') {
                statusEl.textContent = '❌ Timeout (server slow)';
            } else {
                statusEl.textContent = '❌ Error: ' + e.message;
            }
            statusEl.style.color = '#ff6b61';
        }
    }

    function renderGroupList() {
        const list = document.getElementById('group-list');
        list.innerHTML = '';
        groups.forEach(g => {
            const div = document.createElement('div');
            div.className = 'group-item';
            const cb = document.createElement('input');
            cb.type = 'checkbox';
            cb.checked = selectedGroupIds.has(g.id);
            cb.addEventListener('change', () => {
                if (cb.checked) selectedGroupIds.add(g.id);
                else selectedGroupIds.delete(g.id);
                updateGroupIds();
            });
            const span = document.createElement('span');
            span.textContent = `${g.name} (${g.id})`;
            div.appendChild(cb);
            div.appendChild(span);
            list.appendChild(div);
        });
        updateGroupIds();
    }

    function updateGroupIds() {
        document.getElementById('group_ids').value = Array.from(selectedGroupIds).join(',');
    }

    function appendLog(type, msg, time) {
        const container = document.getElementById('logContainer');
        const empty = document.getElementById('emptyLogs');
        if (empty) empty.remove();
        const line = document.createElement('div');
        line.className = `log-line log-type-${type}`;
        line.innerHTML = `<span class="log-time">${time || '--:--:--'}</span><span class="log-msg">${msg}</span>`;
        container.appendChild(line);
        container.scrollTop = container.scrollHeight;
    }

    function clearLogs() {
        document.getElementById('logContainer').innerHTML = '<div class="empty-logs" id="emptyLogs">⏳ Waiting for action...</div>';
        totalGCs = 0; successCount = 0; failCount = 0;
        updateStats();
        document.getElementById('progressBar').style.width = '0%';
    }

    function updateStats() {
        document.getElementById('statTotal').textContent = totalGCs;
        document.getElementById('statSuccess').textContent = successCount;
        document.getElementById('statFailed').textContent = failCount;
        const pct = totalGCs > 0 ? Math.round(((successCount + failCount) / totalGCs) * 100) : 0;
        document.getElementById('statProgress').textContent = pct + '%';
        document.getElementById('progressBar').style.width = pct + '%';
    }

    document.getElementById('mainForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        clearLogs();
        const startBtn = document.getElementById('startBtn');
        startBtn.disabled = true;
        const mode = document.getElementById('modeInput').value;
        startBtn.textContent = mode === 'create' ? '⏳ Creating...' : '⏳ Adding...';

        const formData = new FormData(e.target);
        try {
            const response = await fetch('/', { method: 'POST', body: formData });
            if (!response.ok) {
                const text = await response.text();
                appendLog('error', 'Server error: ' + text, new Date().toLocaleTimeString());
                startBtn.disabled = false;
                startBtn.textContent = mode === 'create' ? '🚀 Start Creating GCs' : '🚀 Start Adding Users';
                return;
            }

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';
            while (true) {
                const {done, value} = await reader.read();
                if (done) break;
                buffer += decoder.decode(value, {stream: true});
                const lines = buffer.split('\n\n');
                buffer = lines.pop();
                lines.forEach(line => {
                    if (line.startsWith('data: ')) {
                        try {
                            const data = JSON.parse(line.substring(6));
                            appendLog(data.type, data.msg, data.time);
                            if (data.type === 'info') {
                                const match = data.msg.match(/(?:Creating|Processing) GC\s+(\d+)\/(\d+)/i);
                                if (match) {
                                    totalGCs = parseInt(match[2]);
                                    updateStats();
                                }
                            } else if (data.type === 'success' && (data.msg.includes('Added') || data.msg.includes('Sent'))) {
                                successCount++;
                                updateStats();
                            } else if (data.type === 'error') {
                                failCount++;
                                updateStats();
                            }
                        } catch(e) {}
                    }
                });
            }
            startBtn.disabled = false;
            startBtn.textContent = mode === 'create' ? '🚀 Start Creating GCs' : '🚀 Start Adding Users';
        } catch (err) {
            appendLog('error', 'Connection error: ' + err.message, new Date().toLocaleTimeString());
            startBtn.disabled = false;
            startBtn.textContent = mode === 'create' ? '🚀 Start Creating GCs' : '🚀 Start Adding Users';
        }
    });

    window.clearLogs = clearLogs;
</script>
</body>
</html>
